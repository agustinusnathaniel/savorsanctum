allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  "esbuild": true
  "sharp": true
  "workerd": true

"overrides":
  "vite": 'catalog:'
  "vitest": 'catalog:'
  # Force patched seroval chain (GHSA-66fc-rw6m-c2q6, GHSA-mv8w-475r-vwqw,
  # GHSA-3rxj-6cgf-8cfw, GHSA-hj76-42vx-jwp4, GHSA-3j22-8qj3-26mx,
  # GHSA-hx9m-jf43-8ffr): solid-js >= 1.9.14 uses seroval ~1.5.4
  "seroval": "1.5.5"
  "seroval-plugins": "1.5.5"
  "solid-js": "1.9.14"
  # Force patched sharp (GHSA-f88m-g3jw-g9cj: libvips CVEs). Global override covers
  # all chains: miniflare (0.35.2 via wrangler 4.116.0/vite-plugin 1.49.0), assets-generator
  # direct (^0.33.5), and sharp-ico's '*' dep (was resolving to 0.34.5). 0.35.3 is a patch
  # over miniflare's 0.35.2 pin. (Nested scoped selectors like
  # "@vite-pwa/assets-generator>sharp-ico>sharp" fail pnpm's selector parser.)
  "sharp": "0.35.3"
  # brace-expansion DoS (GHSA-mh99-v99m-4gvg): patched only in >=5.0.8, which is
  # API-incompatible with minimatch@3/5 (export shape changed). Force minimatch@10 under
  # the two unmaintained consumers (dotgitignore -> release tooling, filelist -> PWA build)
  # so brace-expansion resolves to ^5.0.8 (verified makeRe/.match compat).
  "dotgitignore>minimatch": "10.2.6"
  "filelist>minimatch": "10.2.6"
  # Audit: undici <7.29.0 (cross-user info disclosure, CRLF injection, cookie
  # attribute injection, downstream response) via miniflare/wrangler/jsdom. Exact
  # pin keeps jsdom's deep import (undici/lib/handler/wrap-handler.js) on v7.
  "undici": "7.29.0"
  # Audit: fast-uri <3.1.5 (host confusion via backslash authority) via
  # commitlint ajv + workbox-build ajv.
  "fast-uri": "3.1.5"
  # Audit: postcss <=8.5.22 (GHSA-fxqj-rqcc-2cmp sourceMappingURL .map read) via
  # vite-plus-core / tailwindcss build chain.
  "postcss": "8.5.23"
  # Audit: js-yaml <4.3.1 (CVE-2026-59870 quadratic CPU consumption in !!omap
  # resolution) via commitlint cosmiconfig + TanStack start-plugin xmlbuilder2.
  "js-yaml": "4.3.1"
  # Audit: nanoid <3.3.17 (GHSA-2v37-7h3g-55p8 custom generators can loop
  # indefinitely when size is zero) via postcss build chain.
  "nanoid": "3.3.17"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.5
  vitest: 4.1.10
  vite-plus: ^0.2.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - "@base-ui/react"
  - "@base-ui/utils"
  - "@tanstack/react-table"
  - "@tanstack/table-core"
